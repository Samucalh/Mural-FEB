<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Mural FEB</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth-pages.js"></script></head>
<body class="auth-wrap"><main class="auth-box"><div class="brand">MURAL <span>FEB</span></div><h1>Crie sua conta</h1><p class="muted">Faça parte da comunidade Mural FEB.</p><form onsubmit="register(event)"><div class="form-row"><div class="field"><label for="nome">Nome</label><input id="nome" required maxlength="80"></div><div class="field"><label for="sobrenome">Sobrenome</label><input id="sobrenome" required maxlength="100"></div></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label for="confirmacao">Confirmar senha</label><input id="confirmacao" type="password" required minlength="8"></div><button class="btn gold" style="width:100%" type="submit">Criar conta</button></form><div id="message"></div><div class="auth-links"><a href="login.html">Já tenho uma conta</a><a href="privacidade.html">Privacidade</a></div></main></body></html>
